<!DOCTYPE html>
<html lang="nl-BE" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syllabus sociaal beleid: dak- en thuisloosheid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="hide-checks">

<header class="topbar">
  <span class="brand"><span class="lion" aria-hidden="true"></span>Sociaal beleid 2026-2027</span>
  <nav class="pages" aria-label="Pagina's">
    <a href="index.html" aria-current="page">Syllabus</a>
    <a href="onderzoek.html">Onderzoek</a>
  </nav>
  <div class="actions">
    <button id="theme-toggle" type="button" title="Licht of donker">Donker</button>
    <button id="download-page" type="button" title="De syllabus als 1 HTML-bestand">Download webpagina</button>
    <a class="button primary" href="content/syllabus.docx" download="syllabus-sociaal-beleid-ruben-mergaert.docx">Download Word</a>
  </div>
</header>

<div class="layout">
<aside class="toc">
  <p class="toc-title">Inhoud</p>
  <ol id="toc-list"></ol>
</aside>

<main id="syllabus">
  <section class="hero"><p class="lead">De syllabus wordt geladen...</p></section>
</main>
</div>

<footer class="foot">Persoonlijke syllabus sociaal beleid, Ruben Mergaert, academiejaar 2026-2027. <a href="admin.html">Beheer</a></footer>

<script src="vendor/mammoth.js"></script>
<script src="app.js"></script>
<script src="render.js"></script>
<script>
  (async () => {
    const main = document.getElementById("syllabus");
    const toc = document.getElementById("toc-list");
    try {
      const res = await fetch("content/syllabus.docx?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      await renderSyllabus(await res.arrayBuffer(), main);
      buildToc(main, toc);
      initToc();
      if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
    } catch (err) {
      console.error("[syllabus] laden mislukt", err);
      main.innerHTML = "<section><h2>De syllabus kon niet laden</h2><p>Open de site via een webserver of GitHub Pages. Een lokaal geopend bestand mag het Word-bestand niet inlezen.</p></section>";
    }
    document.getElementById("download-page").addEventListener("click", () => downloadStandalone(main, toc));
  })();
</script>
</body>
</html>
